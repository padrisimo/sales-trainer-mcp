<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Trainer — TTS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101418;
        color: #e6edf3;
        font: 13px system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 320px;
      }
      #avatar {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        padding: 12px;
        background: #171d24;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #text {
        padding: 8px;
        border: 1px solid #2c3642;
        border-radius: 6px;
        background: #1f2833;
        color: inherit;
      }
      #speak {
        padding: 10px;
        border: 1px solid #2c3642;
        border-radius: 6px;
        background: #2a3542;
        color: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="avatar"></canvas>
    <section id="controls">
      <label for="text">Frase</label>
      <input id="text" value="Hola, soy Marta. ¿En qué puedo ayudarte?" />
      <button id="speak" type="button">Hablar</button>
      <p id="status">listo</p>
      <p>Los visemas vienen del motor TTS con sus tiempos; el reloj maestro es <code>AudioContext.currentTime</code>.</p>
    </section>
    <script type="module" src="/static/js/tts-debug.js"></script>
  </body>
</html>
