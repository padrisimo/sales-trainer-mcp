<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Trainer — visemes</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #101418;
        color: #e6edf3;
        font: 13px system-ui, sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 1fr 260px;
      }
      #avatar {
        display: block;
        width: 100%;
        height: 100%;
      }
      #controls {
        padding: 12px;
        overflow-y: auto;
        background: #171d24;
      }
      #panel {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6px;
        margin-bottom: 12px;
      }
      #panel button {
        padding: 8px 4px;
        border: 1px solid #2c3642;
        border-radius: 6px;
        background: #1f2833;
        color: inherit;
        cursor: pointer;
      }
      #panel button:hover {
        background: #2a3542;
      }
      #status {
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="avatar"></canvas>
    <section id="controls">
      <p id="status">viseme: sil</p>
      <div id="panel"></div>
      <p>Pulsa un viseme para ver la forma de la boca. El idle sigue activo.</p>
    </section>
    <script type="module" src="/static/js/debug.js"></script>
  </body>
</html>
